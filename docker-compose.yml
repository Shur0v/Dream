services:
  postgres:
    image: postgres:16-alpine
    container_name: dreamshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamshop}
      POSTGRES_USER: ${POSTGRES_USER:-dreamshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dreamshop123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreamshop} -d ${POSTGRES_DB:-dreamshop}"]
      interval: 10s
      timeout: 5s
      retries: 10
